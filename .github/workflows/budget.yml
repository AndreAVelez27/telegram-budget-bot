name: Budget Bot

on:
  schedule:
    # Escucha de gastos cada 5 minutos
    - cron: "*/5 * * * *"
    # Inicio de cada semana de presupuesto (sábados 8am Colombia = 13:00 UTC)
    - cron: "0 13 * * 6"
    # Días 24-27: el script decide internamente cuál es el día real de nómina
    - cron: "0 13 24-27 * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: false
        default: "escucha"
        type: choice
        options:
          - escucha
          - semanal
          - resumen
          - nomina

permissions:
  contents: write

jobs:
  enviar-presupuesto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Escucha de gastos (cada 5 min)
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '*/5')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python3 budget_bot.py --escucha

      - name: Flujo de nómina (días 24-27)
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 13 24-27')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python3 budget_bot.py --nomina

      - name: Enviar presupuesto semanal (sábados)
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '0 13 * *')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 budget_bot.py

      - name: Ejecución manual
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: |
          if [ "${{ github.event.inputs.modo }}" = "resumen" ]; then
            python3 budget_bot.py --resumen
          elif [ "${{ github.event.inputs.modo }}" = "nomina" ]; then
            python3 budget_bot.py --nomina
          elif [ "${{ github.event.inputs.modo }}" = "escucha" ]; then
            python3 budget_bot.py --escucha
          else
            python3 budget_bot.py
          fi

      - name: Persistir state.json
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push
